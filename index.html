<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VibeWave - a modern music player by Abdul Basit"
    />
    <title>VibeWave | Music Player</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="logo">
          <i class="fas fa-wave-square"></i
          ><span class="logo-text">Vibe<span>Wave</span></span>
        </div>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Search songs, artists..."
            aria-label="Search songs or artists"
          />
        </div>
        <nav class="filters" aria-label="Genre filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pop">Pop</button>
          <button class="filter-btn" data-filter="rock">Rock</button>
          <button class="filter-btn" data-filter="hiphop">Hip Hop</button>
          <button class="filter-btn" data-filter="jazz">Jazz</button>
        </nav>
      </header>

      <main class="main-content">
        <section class="playlist-section">
          <div class="playlist-header">
            <h2>
              <i class="fas fa-list-ul"></i>
              <span id="playlistTitle">Your Playlist</span>
            </h2>
            <div class="playlist-actions">
              <select id="sortSelect" aria-label="Sort songs">
                <option value="default">Sort: Default</option>
                <option value="title">Title A-Z</option>
                <option value="artist">Artist A-Z</option>
                <option value="duration">Duration</option>
              </select>
              <button id="clearRecent" title="Clear history" hidden>
                <i class="fas fa-trash"></i>
              </button>
              <button id="showFavorites" title="Favorites">
                <i class="fas fa-heart"></i>
              </button>
              <button id="showRecent" title="Recently played">
                <i class="fas fa-clock"></i>
              </button>
              <button id="showAll" title="All songs">
                <i class="fas fa-list"></i>
              </button>
            </div>
          </div>
          <p class="playlist-stats" id="playlistStats"></p>
          <div class="playlist-container" id="playlistContainer"></div>
        </section>

        <aside class="player-section">
          <div class="album-art" id="albumArt">
            <img id="albumCover" src="" alt="Album cover" />
            <div class="album-overlay"><i class="fas fa-play"></i></div>
          </div>
          <div class="song-info">
            <h3 id="songTitle">Loading...</h3>
            <p id="songArtist">VibeWave</p>
          </div>
          <div class="progress-area">
            <span id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar">
              <div class="progress" id="progress"></div>
            </div>
            <span id="totalTime">0:00</span>
          </div>
          <div class="controls">
            <button id="shuffleBtn" title="Shuffle">
              <i class="fas fa-random"></i>
            </button>
            <button id="prevBtn" title="Previous">
              <i class="fas fa-step-backward"></i>
            </button>
            <button id="playBtn" class="play-btn" title="Play / Pause">
              <i class="fas fa-play"></i>
            </button>
            <button id="nextBtn" title="Next">
              <i class="fas fa-step-forward"></i>
            </button>
            <button id="repeatBtn" title="Repeat">
              <i class="fas fa-redo"></i>
            </button>
          </div>
          <div class="volume-area">
            <i class="fas fa-volume-up" id="volumeIcon"></i>
            <input
              type="range"
              id="volumeSlider"
              min="0"
              max="100"
              value="70"
              aria-label="Volume"
            />
          </div>
          <div class="extras">
            <button id="speedBtn" title="Playback speed">1x</button>
            <button id="sleepBtn" title="Sleep timer">
              <i class="fas fa-moon"></i> <span>Off</span>
            </button>
            <button id="themeBtn" title="Change accent color">
              <i class="fas fa-palette"></i>
            </button>
            <button id="helpBtn" title="Keyboard shortcuts">
              <i class="fas fa-keyboard"></i>
            </button>
          </div>
          <button class="fav-action" id="favoriteBtn">
            <i class="far fa-heart"></i> Add to Favorites
          </button>
        </aside>
      </main>

      <footer class="footer">
        Made with <i class="fas fa-heart"></i> by Abdul Basit &nbsp;|&nbsp;
        Press ? for shortcuts
      </footer>
    </div>
    <div class="modal" id="helpModal" hidden>
      <div class="modal-box">
        <h3>Keyboard shortcuts</h3>
        <ul>
          <li><b>Space</b> Play / Pause</li>
          <li><b>&larr; &rarr;</b> Previous / Next</li>
          <li><b>&uarr; &darr;</b> Volume</li>
          <li><b>M</b> Mute</li>
          <li><b>S</b> Shuffle</li>
          <li><b>R</b> Repeat</li>
          <li><b>F</b> Favourite</li>
          <li><b>/</b> Search</li>
          <li><b>?</b> This help</li>
        </ul>
        <button id="closeHelp">Close</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <audio id="audioPlayer" preload="metadata"></audio>
    <script src="script.js"></script>
  </body>
</html>
